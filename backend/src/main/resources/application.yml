spring:
  application:
    name: contactflow-ticket-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/contactflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:contactflow}
    password: ${SPRING_DATASOURCE_PASSWORD:contactflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: ${SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_ENABLED:true}
          max-attempts: ${SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL:1000}
          multiplier: ${SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER:2}
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /docs

contactflow:
  events:
    rabbit:
      enabled: ${CONTACTFLOW_RABBIT_ENABLED:false}
      exchange: ${CONTACTFLOW_RABBIT_EXCHANGE:contactflow.ticket.events}
      ai-assist-routing-key: ${CONTACTFLOW_RABBIT_AI_ASSIST_ROUTING_KEY:ticket.created}
      ai-assist-queue: ${CONTACTFLOW_RABBIT_AI_ASSIST_QUEUE:ai.assist.request}
      ai-assist-dlq: ${CONTACTFLOW_RABBIT_AI_ASSIST_DLQ:ai.assist.dlq}
      ai-assist-completed-routing-key: ${CONTACTFLOW_RABBIT_AI_ASSIST_COMPLETED_ROUTING_KEY:ai.assist.completed}
      ai-assist-completed-queue: ${CONTACTFLOW_RABBIT_AI_ASSIST_COMPLETED_QUEUE:ai.assist.completed}
      ai-assist-completed-dlq: ${CONTACTFLOW_RABBIT_AI_ASSIST_COMPLETED_DLQ:ai.assist.completed.dlq}
  redis:
    enabled: ${CONTACTFLOW_REDIS_ENABLED:false}
    ticket-cache-ttl-seconds: ${CONTACTFLOW_TICKET_CACHE_TTL_SECONDS:300}
