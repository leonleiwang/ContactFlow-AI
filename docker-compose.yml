services:
  mysql:
    image: mysql:8.4
    container_name: contactflow-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-contactflow}
      MYSQL_USER: ${MYSQL_USER:-contactflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-contactflow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-contactflow_root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-contactflow} -p${MYSQL_PASSWORD:-contactflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: contactflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: contactflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-contactflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-contactflow}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: contactflow-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-contactflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-contactflow}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-contactflow}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-contactflow}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-contactflow}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CONTACTFLOW_RABBIT_ENABLED: ${CONTACTFLOW_RABBIT_ENABLED:-true}
      CONTACTFLOW_REDIS_ENABLED: ${CONTACTFLOW_REDIS_ENABLED:-true}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    container_name: contactflow-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    container_name: contactflow-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
      - ai-service

volumes:
  mysql-data:
  redis-data:
